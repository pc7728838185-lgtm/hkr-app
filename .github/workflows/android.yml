name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html www/
          cp styles.css www/
          cp app.js www/
          cp config.js www/
          cp auth-update.js www/
          cp manifest.json www/
          cp sw.js www/
          cp -r assets www/ 2>/dev/null || true

      - name: Add Android platform
        run: npx cap add android

      - name: Add Notification Permission
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml

      - name: Copy Firebase File
        run: cp google-services.json android/app/google-services.json

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HKR-APP-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
